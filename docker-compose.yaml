version: '3.8'

services:
  astro-app:
    build: .
    container_name: jcd-groupe-front
    restart: always
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      # Permet de synchroniser votre code source sans reconstruire l'image
      - .:/app
      # Évite de surécrire les node_modules du conteneur avec ceux de l'hôte
      - /app/node_modules
  directus:
    container_name: jcd-groupe-api
    image: directus/directus:latest
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - ./directus/database:/directus/database
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    environment:
      KEY: "${DIRECTUS_KEY}"
      SECRET: "${DIRECTUS_SECRET}"
      DB_CLIENT: "sqlite3"
      DB_FILENAME: "/directus/database/data.db"
      
      PUBLIC_URL: "${PUBLIC_DIRECTUS_URL}"
      
      ADMIN_EMAIL: "${DIRECTUS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${DIRECTUS_ADMIN_PASSWORD}"
      
      CORS_ENABLED: "true"
      CORS_ORIGIN: "${PUBLIC_FRONT_URL}"
      CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
      CORS_CREDENTIALS: "true"
    restart: unless-stopped
